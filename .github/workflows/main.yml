name: ChainSaw Leg CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: chainsaw-leg-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-target-branch:
    name: Validate Pull Request Target Branch
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request branches
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Branch validation is not required for this event."
            exit 0
          fi

          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Only develop can be merged into main."
            exit 1
          fi

          if [ "${{ github.base_ref }}" = "develop" ] && [ "${{ github.head_ref }}" = "main" ]; then
            echo "Pull requests from main into develop are forbidden."
            exit 1
          fi

          echo "Pull request branch flow is valid."

  unity-project-validation:
    name: Validate Unity Project
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - validate-target-branch

    steps:
      - name: Run Unity EditMode tests
        id: unity-editmode-tests
        timeout-minutes: 30
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.9f1
          customImage: unityci/editor:ubuntu-6000.3.9f1-base-3
          testMode: editmode
          artifactsPath: unity-test-artifacts
          coverageOptions: ''
          customParameters: -logFile /dev/stdout -assemblyNames ChainSawLeg.Project.Tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: unity-test-artifacts

      - name: CI completed
        run: echo "Basic CI validation completed successfully."
